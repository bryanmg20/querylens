# Contrato del snapshot compartido entre telemetry_pipeline (productor) y
# detection_engine (consumidor). Se instala en cada imagen con
# `pip install /contract` y en desarrollo con `pip install -e contract`.
[build-system]
# Version exacta: pip descarga el backend en cada build (aislado), y con un
# rango cada imagen podia construir el contrato con otro setuptools.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "querylens-contract"
version = "1.0.0"
description = "Modelos pydantic del snapshot de QueryLens"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[tool.setuptools]
packages = ["querylens_contract"]
