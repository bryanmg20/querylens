version: '3.8'

services:
  postgres:
    image: ghcr.io/pgmq/pg17-pgmq:latest
    container_name: querylens_db
    environment:
      POSTGRES_USER: ${QUERYLENS_USER}
      POSTGRES_PASSWORD: ${QUERYLENS_PASSWORD}
      POSTGRES_DB: ${QUERYLENS_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./querylens_database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./querylens_database/registered_databases.sql:/docker-entrypoint-initdb.d/02_registered_databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QUERYLENS_USER} -d ${QUERYLENS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth_service
    container_name: querylens_auth_service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      QUERYLENS_DB: ${QUERYLENS_DB}
      QUERYLENS_USER: ${QUERYLENS_USER}
      QUERYLENS_PASSWORD: ${QUERYLENS_PASSWORD}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    extra_hosts:
      # Permite usar "host.docker.internal" para registrar bases de datos que
      # corren directamente en la maquina del cliente (fuera de Docker),
      # tanto en Docker Desktop (Win/Mac, ya lo resuelve por defecto) como en
      # Linux nativo (donde requiere esta entrada explicita).
      - "host.docker.internal:host-gateway"
    ports:
      - "${AUTH_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_AUTH_SERVICE_URL: ${NEXT_PUBLIC_AUTH_SERVICE_URL:-http://localhost:8000}
    container_name: querylens_frontend
    environment:
      NEXT_PUBLIC_AUTH_SERVICE_URL: ${NEXT_PUBLIC_AUTH_SERVICE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - auth-service
    restart: unless-stopped

  pipeline:
    # Daemon de extraccion (telemetry_pipeline/runner.py): cada
    # EXTRACT_INTERVAL_S vuelve a leer registered_databases y extrae las filas
    # activas. Sin consumidor en la cola, revisar el crecimiento de PGMQ.
    build:
      context: ./telemetry_pipeline
    container_name: querylens_pipeline
    environment:
      # La cola vive en el servicio postgres de esta red: 5432 AQUI dentro,
      # no ${DB_PORT} (que es el puerto publicado en el host).
      DB_HOST: postgres
      DB_PORT: 5432
      QUERYLENS_DB: ${QUERYLENS_DB}
      QUERYLENS_USER: ${QUERYLENS_USER}
      QUERYLENS_PASSWORD: ${QUERYLENS_PASSWORD}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
      EXTRACT_INTERVAL_S: ${EXTRACT_INTERVAL_S:-10}
      # Solo los usa la entrada main_sandbox.py (no el runner): el sandbox
      # publica 5432/3307 en el host, de ahi host.docker.internal.
      MONITOR_PG_HOST: host.docker.internal
      MONITOR_PG_PORT: 5432
      MONITOR_MY_HOST: host.docker.internal
      MONITOR_MY_PORT: 3307
    extra_hosts:
      # Las bases registradas apuntan a host.docker.internal cuando corren en
      # la maquina del cliente (mismo motivo que auth-service).
      - "host.docker.internal:host-gateway"
    volumes:
      - pipeline_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  pipeline_logs: