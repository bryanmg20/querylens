services:
  postgres:
    image: postgres:17
    container_name: ql_postgres
    environment:
      POSTGRES_USER: ql_user
      POSTGRES_PASSWORD: ql_pass
      POSTGRES_DB: ql_demo
    ports:
      - "5432:5432"
    # auto_explain + log JSON con rotacion semanal: lo que pide
    # telemetry_pipeline/references/006_instalacion_auto_explain.md (Pasos 2-3).
    # Las funciones de lectura del log las crea el servicio postgres_setup.
    # log_lock_waits: la fila que espera cada sesion de un abrazo cuando la
    # sentencia manda sus valores aparte ($1); ver guia 006.
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements,auto_explain
        -c pg_stat_statements.track=all
        -c pg_stat_statements.max=10000
        -c track_activity_query_size=4096
        -c deadlock_timeout=1s
        -c log_lock_waits=on
        -c shared_buffers=16MB
        -c auto_explain.log_min_duration=50ms
        -c auto_explain.log_analyze=off
        -c auto_explain.log_format=json
        -c logging_collector=on
        -c log_destination=stderr,jsonlog
        -c log_filename=postgresql-%a.log
        -c log_truncate_on_rotation=on
        -c log_rotation_age=1d
    volumes:
      - ./init/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ql_user -d ql_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ql_network

  # Crea las funciones querylens.log_files() / querylens.read_log() (Paso 4 de
  # la guia 006) en cada `up`, tambien con un volumen que ya existia: los
  # scripts de docker-entrypoint-initdb.d solo corren con el volumen vacio.
  # Espera a que exista querylens_monitor por TCP: en el primer arranque el
  # healthcheck puede pasar mientras init_postgres.sql todavia corre.
  postgres_setup:
    image: postgres:17
    container_name: ql_postgres_setup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ql_pass
    volumes:
      - ./init/auto_explain_postgres.sql:/setup/auto_explain_postgres.sql:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        until psql -h postgres -U ql_user -d ql_demo -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'querylens_monitor'" 2>/dev/null | grep -q 1; do
          sleep 1
        done
        psql -h postgres -U ql_user -d ql_demo -v ON_ERROR_STOP=1 -q -f /setup/auto_explain_postgres.sql
    restart: "no"
    networks:
      - ql_network

  mysql:
    image: mysql:8.0
    container_name: ql_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ql_root
      MYSQL_DATABASE: ql_demo
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - "3307:3306"
    # performance_schema_max_sql_text_length: bytes de SQL_TEXT que guarda
    # performance_schema (MySQL trae 1024). Si una muestra llega al limite el
    # pipeline avisa QUERY_TEXT_TRUNCATED. Es de arranque: tras cambiarlo,
    #   docker compose up -d mysql
    # innodb_print_all_deadlocks + log_error_verbosity=3: cada abrazo mortal
    # llega a performance_schema.error_log (InnoDB lo escribe como Note, que
    # la verbosidad 2 descarta). Ambas son dinamicas: SET PERSIST en clientes.
    command: >
      --performance-schema=ON
      --performance-schema-instrument='statement/%=ON'
      --performance-schema-consumer-events-statements-history=ON
      --performance-schema-consumer-events-statements-history-long=ON
      --performance-schema-consumer-events-waits-current=ON
      --max_connections=1000
      --performance-schema-consumer-statements-digest=ON
      --performance-schema-consumer-events-waits-current=ON
      --performance-schema-consumer-events-waits-history=ON
      --performance-schema-instrument='wait/io/table/sql/handler=ON'
      --temptable_max_ram=1048576
      --performance-schema-max-sql-text-length=${MYSQL_SQL_TEXT_LENGTH:-4096}
      --innodb-print-all-deadlocks=ON
      --log-error-verbosity=3
    volumes:
      - ./init/init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pql_root"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - ql_network

  sysbench:
    image: debian:bookworm-slim
    container_name: ql_sysbench
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y --no-install-recommends sysbench default-mysql-client postgresql-client &&
        tail -f /dev/null
      "
    networks:
      - ql_network

volumes:
  postgres_data:
  mysql_data:

networks:
  ql_network:
    driver: bridge