# Punto de entrada unico de QueryLens. Es el unico servicio con puerto
# publicado: frontend, auth-service y api-rest solo son alcanzables por la red
# interna de Docker.
#
#   /        -> frontend:3000
#   /auth/*  -> auth-service:8000/*   (/auth/databases -> /databases)
#   /api/*   -> api-rest:8001/*       (/api/diagnostics -> /diagnostics)
server {
    listen 80;
    server_name _;
    server_tokens off;

    # DNS interno de Docker. proxy_pass con variable resuelve el nombre en cada
    # peticion (cache de 10s): si un contenedor se recrea y cambia de IP, nginx
    # no queda apuntando a la vieja (502) ni hay que reiniciarlo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirects que arma nginx mismo (/auth -> /auth/) con Location relativo:
    # absoluto saldria con el puerto 80 del contenedor, no el publicado.
    absolute_redirect off;

    proxy_http_version 1.1;
    # $http_host conserva el puerto (localhost:8080): con $host un redirect
    # que arme FastAPI o Next mandaria al navegador al puerto 80.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Healthcheck del contenedor: responde nginx mismo, sin pasar al frontend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Con variable, proxy_pass no recorta el prefijo: lo quita el rewrite (el
    # query string se conserva).
    location /auth/ {
        set $auth_service http://auth-service:8000;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $auth_service;
    }

    location /api/ {
        set $api_rest http://api-rest:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_rest;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
    }
}
