name: pipeline

on:
  push:
    # develop es la rama de integracion por ahora, pero cualquier push directo
    # dispara el workflow: las ramas de trabajo validan sin necesidad de PR.
    # Sin pull_request: los checks del push salen en el PR (mismo commit), y
    # con los dos cada PR corria el workflow dos veces.
    branches: ["**"]

# Solo lectura: ningun job escribe en el repo, los releases ni los PR.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # ruff con telemetry_pipeline/ruff.toml: solo reglas que encuentran
    # defectos (imports sin usar, tests con excepciones ciegas, nombres
    # redefinidos). La version sale del lock requirements-dev.txt (la linea
    # "ruff==X \\" sin la continuacion).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "$(grep -o '^ruff==[^ ]*' telemetry_pipeline/requirements-dev.txt)"
      - run: ruff check telemetry_pipeline

  unit:
    # Corre en cada push. Sin servicios: si algo falla aqui, no se fusiona.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: telemetry_pipeline/requirements-dev.txt
      - run: pip install --require-hashes -r telemetry_pipeline/requirements-dev.txt
      - name: unit y contract
        run: python -m pytest -m "not integration" --junitxml=report-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-unit
          path: report-unit.xml

  detector:
    # Tests del detection_engine (antipatrones, contencion y el contrato
    # contra los goldens del pipeline). Sin servicios, como unit. Usa su
    # propio pytest.ini: `models` es el de detection_engine, no el del pipeline.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            detection_engine/requirements.txt
            telemetry_pipeline/requirements-dev.txt
      # Los dos locks juntos, como test_runner (pytest sale del de dev). El
      # contrato va aparte: un directorio local no tiene hash.
      - run: |
          pip install --require-hashes -r detection_engine/requirements.txt -r telemetry_pipeline/requirements-dev.txt
          pip install --no-deps -e contract
      - name: detector
        working-directory: detection_engine
        run: python -m pytest --junitxml=../report-detector.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-detector
          path: report-detector.xml

  stack:
    # Levanta docker-compose.yml tal cual (red interna, roles por servicio,
    # nginx) y lo prueba desde fuera solo por el puerto de nginx. Si un
    # servicio apunta a localhost en vez de al nombre del contenedor, o a un
    # rol le falta un GRANT, algun servicio no llega a healthy o el smoke falla.
    needs: unit
    runs-on: ubuntu-latest
    # Build de las imagenes + up --wait (300 s) + smoke.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: mirror de Docker Hub
        # Mismo motivo que los services de integration: las imagenes base
        # (nginx, python, node) salen de Docker Hub y el runner comparte IP.
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: .env desechable
        # El .env real no se versiona: valores aleatorios solo para este job,
        # con el mismo generador que se usa en local.
        run: python3 scripts/gen_env.py > .env

      - name: docker compose up
        # --wait: falla si un servicio no llega a healthy (o db-roles no sale
        # con 0). pipeline y detection-engine solo laten tras hablar con la
        # base con su propio rol.
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: smoke por nginx
        # Solo el puerto publicado de nginx: el registro escribe con ql_auth y
        # el diagnostico lee con ql_api. host no se contacta al registrar.
        run: |
          base=http://127.0.0.1:8080
          curl -fsS "$base/healthz"
          curl -fsS -o /dev/null "$base/"
          curl -fsS "$base/auth/health"
          curl -fsS "$base/api/health"
          token=$(curl -fsS -X POST "$base/auth/databases" \
            -H 'Content-Type: application/json' \
            -d '{"connection_name":"ci","engine":"postgresql","host":"ci.invalid","port":5432,"username":"ci","password":"ci","database_name":"ci"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -o /dev/null -H "Authorization: Bearer $token" "$base/api/diagnostics"

      - name: estado y logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

  integration:
    # Corre en cada push (merge a cualquier rama), despues de unit.
    # Sin gate a develop: si algo falla aqui, no hay merge limpio.
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Imagenes oficiales desde mirror.gcr.io (espejo de Docker Hub de Google,
    # sin autenticacion). Docker Hub y public.ecr.aws limitan las descargas
    # anonimas por IP, y los runners de GitHub comparten IPs: los dos ya
    # fallaron con toomanyrequests.
    services:
      telemetry-postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: querylens_monitor
          POSTGRES_PASSWORD: monitor_pass
          POSTGRES_DB: ql_demo
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U querylens_monitor -d ql_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      telemetry-mysql:
        image: mirror.gcr.io/library/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ql_root
          MYSQL_DATABASE: ql_demo
          MYSQL_USER: querylens_monitor
          MYSQL_PASSWORD: monitor_pass
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pql_root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

      querylens-db:
        image: ghcr.io/pgmq/pg17-pgmq:v1.13.0@sha256:1ce7c40f588a08cfad14bc2b228eb35db98270163e27308cec109762b8120c85
        env:
          POSTGRES_USER: ql_user
          POSTGRES_PASSWORD: ql_pass
          POSTGRES_DB: ql_demo
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U ql_user -d ql_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONITOR_PG_HOST: 127.0.0.1
      MONITOR_PG_PORT: "55432"
      MONITOR_PG_DB: ql_demo
      MONITOR_PG_USER: querylens_monitor
      MONITOR_PG_PASSWORD: monitor_pass
      MONITOR_MY_HOST: 127.0.0.1
      MONITOR_MY_PORT: "53306"
      MONITOR_MY_USER: querylens_monitor
      MONITOR_MY_PASSWORD: monitor_pass
      APP_MY_USER: ql_mysql_app
      APP_MY_PASSWORD: app_pass
      APP_MY_DB: ql_demo
      DB_HOST: 127.0.0.1
      DB_PORT: "55433"
      QUERYLENS_DB: ql_demo
      QUERYLENS_USER: ql_user
      QUERYLENS_PASSWORD: ql_pass
      APP_PG_USER: ql_app
      APP_PG_PASSWORD: app_pass

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: telemetry_pipeline/requirements-dev.txt
      - run: pip install --require-hashes -r telemetry_pipeline/requirements-dev.txt

      - name: espera a los tres motores
        run: |
          for i in $(seq 1 30); do
            if docker exec "${{ job.services.telemetry-postgres.id }}" pg_isready -U querylens_monitor -d ql_demo > /dev/null 2>&1 \
               && docker exec "${{ job.services.telemetry-mysql.id }}" mysqladmin ping -h 127.0.0.1 -u root -pql_root > /dev/null 2>&1 \
               && docker exec "${{ job.services.querylens-db.id }}" pg_isready -U ql_user -d ql_demo > /dev/null 2>&1; then
              echo "los tres motores responden"
              exit 0
            fi
            sleep 2
          done
          echo "un motor no respondio a tiempo" >&2
          exit 1

      - name: PGMQ en querylens-db
        # Los services de Actions no montan volumenes: no llega
        # querylens_database/init.sql. Se replica aqui lo que hace ese init
        # en local (extension + cola analyze_job), de forma idempotente.
        run: |
          docker exec -i "${{ job.services.querylens-db.id }}" \
            psql -U ql_user -d ql_demo -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgmq;
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'pgmq' AND c.relname = 'q_analyze_job'
            ) THEN
              PERFORM pgmq.create('analyze_job');
            END IF;
          END
          $$;
          SQL

      - name: Postgres de telemetry con pg_stat_statements y rol monitor
        # shared_preload_libraries solo aplica tras reiniciar: se deja escrito en
        # postgresql.auto.conf y se reinicia el contenedor de servicios.
        run: |
          docker exec -i "${{ job.services.telemetry-postgres.id }}" \
            psql -U querylens_monitor -d ql_demo -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements';
          ALTER SYSTEM SET pg_stat_statements.track = 'all';
          ALTER SYSTEM SET pg_stat_statements.max = '10000';
          SQL
          docker restart "${{ job.services.telemetry-postgres.id }}"
          ready=0
          for i in $(seq 1 30); do
            if docker exec "${{ job.services.telemetry-postgres.id }}" pg_isready -U querylens_monitor -d ql_demo > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "telemetry-postgres no volvio tras el reinicio" >&2
            exit 1
          fi
          docker exec -i "${{ job.services.telemetry-postgres.id }}" \
            psql -U querylens_monitor -d ql_demo -v ON_ERROR_STOP=1 -c \
            "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"

      - name: rol de aplicacion separado del monitor
        # STATEMENTS_QUERY filtra userid != session_user. Si el trafico lo
        # genera el propio monitor, el collector no ve nada y los tests de
        # integracion se quedan sin material. Este rol replica la topologia del
        # sandbox: ql_app genera trafico, querylens_monitor observa.
        #
        # El schema lo crea el superusuario del contenedor (POSTGRES_USER) y se
        # lo cede a ql_app, para que los grants de lectura no dependan de que el
        # rol monitor sea superusuario. Es lo mismo que hace
        # ql_sandbox/init/init_postgres.sql.
        run: |
          docker exec -i "${{ job.services.telemetry-postgres.id }}" \
            psql -U querylens_monitor -d ql_demo -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ql_app') THEN
              CREATE ROLE ql_app LOGIN PASSWORD 'app_pass';
            END IF;
          END
          $$;
          GRANT CONNECT ON DATABASE ql_demo TO ql_app;
          CREATE SCHEMA IF NOT EXISTS ql_ci_load AUTHORIZATION ql_app;
          GRANT USAGE ON SCHEMA ql_ci_load TO querylens_monitor;
          -- ALTER DEFAULT PRIVILEGES es por rol: sin FOR ROLE aplicaria a las
          -- tablas que crea el superusuario, no a las de ql_app, y el monitor
          -- se quedaria sin permiso para explicar.
          ALTER DEFAULT PRIVILEGES FOR ROLE ql_app IN SCHEMA ql_ci_load
            GRANT SELECT ON TABLES TO querylens_monitor;
          SQL

      - name: tabla de carga en MySQL
        # El rol de monitoreo no tiene CREATE en ql_demo: el DDL lo aplica root.
        # El GRANT replica ql_sandbox/init/init_mysql.sql: el user creado por la
        # imagen solo recibe privilegios sobre MYSQL_DATABASE, no sobre
        # performance_schema / information_schema, y sin SELECT ahi el collector
        # no puede leer events_statements_summary_by_digest.
        run: |
          docker exec -i "${{ job.services.telemetry-mysql.id }}" mysql -uroot -pql_root <<'SQL'
          CREATE DATABASE IF NOT EXISTS ql_demo;
          USE ql_demo;
          CREATE TABLE IF NOT EXISTS ql_ci (
              id integer PRIMARY KEY,
              k integer NOT NULL,
              pad text
          );
          GRANT SELECT ON *.* TO 'querylens_monitor'@'%';
          GRANT PROCESS ON *.* TO 'querylens_monitor'@'%';
          GRANT REPLICATION CLIENT ON *.* TO 'querylens_monitor'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: rol de aplicacion MySQL
        # Espejo del rol ql_app de Postgres: el monitoreo (querylens_monitor)
        # observa, este rol genera trafico. ACTIVE_QUERIES_QUERY excluye el
        # CURRENT_USER, asi que sin un rol app el control de active_queries no
        # tiene nada que ver. CREATE permite que la carga haga su DDL en ql_demo.
        run: |
          docker exec -i "${{ job.services.telemetry-mysql.id }}" mysql -uroot -pql_root <<'SQL'
          CREATE USER IF NOT EXISTS 'ql_mysql_app'@'%' IDENTIFIED BY 'app_pass';
          GRANT SELECT, CREATE ON `ql_demo`.* TO 'ql_mysql_app'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: carga de trabajo para poblar las vistas de estadisticas
        # El pipeline explica candidatos reales: sin trafico, pg_stat_statements
        # y performance_schema estan vacios y los tests se saltan.
        run: |
          python telemetry_pipeline/ci/load.py

      - name: suite completa
        run: python -m pytest -q --junitxml=report-integration.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-integration
          path: report-integration.xml
